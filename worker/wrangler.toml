name = "solo-realms-chronicler"
main = "src/index.mjs"
compatibility_date = "2026-11-25"

[vars]
AI_PROVIDER = "openai"
AI_MODEL = "gpt-6.2-sol"
ALLOWED_ORIGINS = "https://daltonjk2001-hub.github.io"
DM_DISPLAY_NAME = "The Chronicler"
