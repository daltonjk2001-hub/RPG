name: Solo Realms full regression suite

on:
  push:
    branches:
      - hardening/player-stage-gameplay
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run reproducible build and every regression suite
        run: bash tests/run_v18.sh
