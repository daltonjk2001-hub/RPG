name: Publish Solo Realms after successful main regression

on:
  workflow_run:
    workflows:
      - Solo Realms full regression suite
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: solo-realms-pages-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact tested main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm main still points to the tested revision
        id: freshness
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" == "$TESTED_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Publishing tested main revision $TESTED_SHA"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale build: main is $current_main, tested revision was $TESTED_SHA"
          fi

      - name: Verify this deployment originates from the Pages source branch
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          echo "PASS deployment context is the main branch used by GitHub Pages"

      - name: Rebuild standalone game, PWA and GitHub Pages mirror
        if: steps.freshness.outputs.current == 'true'
        run: python tools/build_v18.py

      - name: Verify V20.1 is present in every player-facing build
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in Solo_Realms_V18_Main.html pwa/index.html docs/index.html; do
            grep -q "Your first adventure" "$file"
            grep -q "sr20-challenge" "$file"
            grep -q "Legacy renown" "$file"
            echo "PASS $file contains V20.1 onboarding, challenge controls and legacy progression"
          done
          test -f docs/manifest.webmanifest
          test -f docs/sw.js
          test -f docs/icons/icon-192.png
          test -f docs/icons/icon-512.png
          cmp -s pwa/index.html docs/index.html
          node tests/solo_realms_v20_release_integrity_test.cjs

      - name: Commit generated player-facing builds
        if: steps.freshness.outputs.current == 'true'
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Solo_Realms_V18_Main.html source/solo_realms_v18.js pwa/ docs/
          if git diff --cached --quiet; then
            echo "Generated player-facing files are already current."
          else
            git commit -m "Publish rebuilt Solo Realms V20.1 gameplay"
            git push origin HEAD:main
          fi
          published_sha="$(git rev-parse HEAD)"
          echo "sha=$published_sha" >> "$GITHUB_OUTPUT"
          echo "Published generated build commit: $published_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the generated GitHub Pages site
        if: steps.freshness.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy the generated site to GitHub Pages
        if: steps.freshness.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
