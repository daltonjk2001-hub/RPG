name: Publish Solo Realms after successful main regression

on:
  workflow_run:
    workflows:
      - Solo Realms full regression suite
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: solo-realms-pages-publish-main
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.freshness.outputs.publish }}
    steps:
      - name: Checkout the exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Skip stale tested revisions
        id: freshness
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          if [[ "$current" == "$TESTED_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale build: main=$current tested=$TESTED_SHA"
          fi

      - name: Confirm the configured Pages source branch
        if: steps.freshness.outputs.publish == 'true'
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Rebuild and verify all player-facing builds
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_v18.py
          for file in Solo_Realms_V18_Main.html pwa/index.html docs/index.html; do
            grep -q "Your first adventure" "$file"
            grep -q "sr20-challenge" "$file"
            grep -q "Legacy renown" "$file"
          done
          test -f docs/manifest.webmanifest
          test -f docs/sw.js
          test -f docs/icons/icon-192.png
          test -f docs/icons/icon-512.png
          cmp -s pwa/index.html docs/index.html
          node tests/solo_realms_v20_release_integrity_test.cjs

      - name: Commit generated player-facing builds
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Solo_Realms_V18_Main.html source/solo_realms_v18.js pwa/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "Publish rebuilt Solo Realms V20.1 gameplay"
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
