name: Solo Realms V18 hardening

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: v18-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Build and regression suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild standalone, PWA, and Pages mirror; run all regression suites
        run: bash tests/run_v18.sh
