name: Solo Realms V18 hardening

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "research/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: v18-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Build and regression suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild standalone, PWA, and Pages mirror; run all regression suites
        run: bash tests/run_v18.sh

      - name: Commit rebuilt standalone, PWA, and Pages assets on branch pushes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Solo_Realms_V18_Main.html source/solo_realms_v18.js pwa docs
          if git diff --cached --quiet; then
            echo "Generated release files are already current."
          else
            git commit -m "Build Solo Realms release assets [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
