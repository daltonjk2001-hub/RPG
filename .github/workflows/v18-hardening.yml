name: Solo Realms V21 gameplay hardening

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "codex/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: solo-realms-v21-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Build and full regression suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild standalone, PWA, Pages mirror, and run every regression suite
        run: bash tests/run_v18.sh
      - name: Publish generated application files after successful main-branch verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Solo_Realms_V18_Main.html source/solo_realms_v18.js pwa docs
          if ! git diff --cached --quiet; then
            git commit -m "Publish generated V21 gameplay hardening artifacts [skip ci]"
            git push origin HEAD:main
          else
            echo "Generated release artifacts are already current."
          fi
